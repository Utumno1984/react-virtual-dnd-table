name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run demo:build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start demo dev server and run smoke test
        run: |
          (cd packages/demo && npx vite --port 5180) &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5180/ > /dev/null && break
            sleep 1
          done
          node packages/demo/e2e/drag-reorder.mjs
